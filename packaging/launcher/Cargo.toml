[package]
name = "acfun-download-gui"
version = "1.4.0"
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/yukitakasama/acfun-download"
description = "AcFun 下载 · 原生桌面 GUI"

[[bin]]
name = "AcFunDownload"
path = "src/main.rs"

[dependencies]
# 原生 GUI：egui 即时模式 + eframe(glow/OpenGL) 窗口
eframe = "=0.29.1"
egui = "=0.29.1"
# 与本地服务通信（只访问 http://127.0.0.1，不需要 TLS）
ureq = { version = "2.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 原生「选择文件夹」对话框（Windows 走 IFileDialog）
rfd = "0.15"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
