[package]
name = "acfun-desktop"
version = "0.7.0"
description = "AcFun 视频下载 · 桌面壳（Tauri 2）"
authors = ["acfun-download"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# 默认不打包自定义协议，保持最小依赖
default = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
